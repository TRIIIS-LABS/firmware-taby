name: Build both displays
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/check.py
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -v

  firmware:
    needs: check
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    strategy:
      fail-fast: false
      matrix:
        board: [amoled-1.64, round-1.32]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and package
        shell: bash
        env:
          TABY_BOARD: ${{ matrix.board }}
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python tools/build.py "$TABY_BOARD"
          python tools/package_release.py "$TABY_BOARD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: taby-${{ matrix.board }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
